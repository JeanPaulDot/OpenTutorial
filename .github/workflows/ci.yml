name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build library
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      # Minified identifier names vary across platforms/versions, so a strict
      # byte-for-byte diff false-positives. Compare what actually matters:
      # the file inventory and the type declarations (which must be stable).
      - name: Verify committed dist matches src
        run: |
          git status --porcelain --untracked-files=all -- dist/ > /tmp/dist-status.txt
          grep -v '\.map$' /tmp/dist-status.txt | grep -v 'dist/.*\.\(js\|cjs\)$' > /tmp/dist-real.txt || true
          if [ -s /tmp/dist-real.txt ]; then
            echo "dist drift (declarations, css, schema, or missing files):"
            cat /tmp/dist-real.txt
            exit 1
          fi

      - name: Smoke-test the CLI
        run: |
          node bin/opentutorial.mjs --version
          node bin/opentutorial.mjs schema

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Covers what jsdom cannot: real layout for placement, real pointer-events
      # for interaction gating, cross-page resume, and the axe accessibility gate.
      - name: E2E and accessibility
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
